backend:
  name: github
  repo: alexmcconathy/mac-auto-collision-site
  branch: main
  # Token sign-in only. The OAuth button needs a Netlify/Cloudflare authenticator this site does not have.
  auth_methods: [token]
  # One-click login (see docs/ONE_CLICK_LOGIN.md): after deploying the authenticator, replace the line above with:
  #   base_url: https://sveltia-cms-auth.<your-subdomain>.workers.dev
  #   auth_methods: [oauth, token]

# Where uploaded photos are stored in the repo, and the URL they are served from
media_folder: "images/uploads"
public_folder: "images/uploads"

site_url: "https://www.macautoandcollision.com"
display_url: "https://www.macautoandcollision.com"
logo_url: "logo.svg"

collections:
  - name: "site"
    label: "Site Content"
    files:
      - name: "settings"
        label: "Contact, Hours & About"
        file: "content/settings.json"
        fields:
          - { label: "Phone", name: "phone", widget: "string" }
          - { label: "Email (estimate requests go here)", name: "email", widget: "string" }
          - { label: "Estimate form delivery address (Formspree form URL, e.g. https://formspree.io/f/abcdwxyz; leave empty and the form uses the visitor's email app)", name: "form_endpoint", widget: "string", required: false, pattern: ["^$|^https://(formspree\\.io|usebasin\\.com|getform\\.io|formsubmit\\.co)/.+", "Must be a Formspree (or Basin/Getform/FormSubmit) form URL starting with https://"] }
          - label: "Rotating headlines (the top of the site cycles through these; the first one shows first)"
            name: "headlines"
            widget: "list"
            required: false
            summary: "{{fields.line1}} {{fields.line2}}"
            fields:
              - { label: "Line 1 (white)", name: "line1", widget: "string" }
              - { label: "Line 2 (red)", name: "line2", widget: "string", required: false }
              - { label: "Sentence under it", name: "subline", widget: "string", required: false }
          - { label: "Seconds between headlines (4 to 30)", name: "headline_seconds", widget: "number", value_type: "int", min: 4, max: 30, default: 7, required: false }
          - { label: "Text-message number (only if this number can receive texts; leave empty to hide the Text Us buttons)", name: "sms_number", widget: "string", required: false }
          - { label: "Announcement banner (leave blank to hide)", name: "announcement", widget: "string", required: false, hint: "Example: Closed Friday July 4th. Reopening Monday." }
          - label: "Hours"
            name: "hours"
            widget: "object"
            fields:
              - { label: "Weekday open", name: "weekday_open", widget: "string", default: "8:00 AM" }
              - { label: "Weekday close", name: "weekday_close", widget: "string", default: "5:00 PM" }
              - { label: "Saturday & Sunday", name: "weekend", widget: "string", default: "Closed" }
          - { label: "About the shop", name: "about", widget: "text", hint: "Leave a blank line between paragraphs." }
          - { label: "Owner's insurance background (one or two sentences; shows under the 'Who does your body shop work for?' comparison; leave empty to hide)", name: "owner_background", widget: "text", required: false }
          - { label: "Cloudflare Web Analytics token (32 characters from the Cloudflare dashboard; leave empty for no tracking)", name: "cloudflare_analytics_token", widget: "string", required: false }
          - { label: "Microsoft Clarity project ID (from clarity.microsoft.com; leave empty for none)", name: "clarity_project_id", widget: "string", required: false }
          - { label: "Logo (full artwork with lettering; shows in the footer, and in the header if no separate mark is set)", name: "logo_image", widget: "image", required: false }
          - { label: "Logo mark for the header (just the car, no lettering; sits beside the shop name)", name: "logo_mark_image", widget: "image", required: false }
          - { label: "Background photo (shows faded behind the headline at the top of the site; upload a wide shot of the shop or a finished car; leave empty for plain black)", name: "hero_image", widget: "image", required: false }
          - { label: "Background photo fade (how much dark tint sits over the photo)", name: "hero_fade", widget: "select", options: ["Light", "Medium", "Dark"], default: "Light", required: false }
          - { label: "Yelp page link", name: "yelp_url", widget: "string", required: false, default: "https://www.yelp.com/biz/mac-auto-and-collision-bessemer-2" }
          - { label: "Yelp rating (e.g. 5.0; leave empty to hide the Yelp card)", name: "yelp_rating", widget: "string", required: false }
          - { label: "Yelp review count (e.g. 12)", name: "yelp_review_count", widget: "string", required: false }
          - { label: "Yelp embedded reviews: paste review IDs, one per line (on Yelp open a review → ⋯ → Embed review → copy the data-review-id value). Up to 3 show.", name: "yelp_review_ids", widget: "list", required: false, field: { label: "Review ID", name: "id", widget: "string" } }
          - { label: "Google review link (from Google Business Profile → Ask for reviews; leave empty to hide the button)", name: "google_review_url", widget: "string", required: false }
          - { label: "Service areas (towns you serve, in order)", name: "service_areas", widget: "list", required: false, default: ["Bessemer", "Hueytown", "McCalla", "Helena", "Hoover", "the greater Birmingham area"] }

      - name: "gallery"
        label: "Photo Gallery"
        file: "content/gallery.json"
        fields:
          - { label: "Intro line", name: "intro", widget: "string", required: false }
          - label: "Quick photos (select or drag in many at once; no captions)"
            name: "photos"
            widget: "image"
            multiple: true
            required: false
            hint: "Finished cars, the shop, the crew. Shown in the gallery as plain photos. Use the list below when you want a caption or a before/after pair."
          - label: "Captioned photos and Before & After pairs"
            name: "items"
            widget: "list"
            required: false
            summary: "{{fields.title}}"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Type", name: "type", widget: "select", options: ["Before & After", "Our Work", "The Shop"], default: "Our Work" }
              - { label: "Photo (for Our Work / The Shop)", name: "image", widget: "image", required: false }
              - { label: "Before photo", name: "before", widget: "image", required: false }
              - { label: "After photo", name: "after", widget: "image", required: false }
              - { label: "Caption", name: "caption", widget: "string", required: false, hint: "Example: 2019 Silverado, driver-side collision repair and paint" }

      - name: "faq"
        label: "FAQ (questions & answers)"
        file: "content/faq.json"
        fields:
          - label: "Questions"
            name: "items"
            widget: "list"
            summary: "{{fields.question}}"
            fields:
              - { label: "Question", name: "question", widget: "string" }
              - { label: "Answer", name: "answer", widget: "text" }

      - name: "testimonials"
        label: "Customer Reviews"
        file: "content/testimonials.json"
        fields:
          - label: "Reviews"
            name: "items"
            widget: "list"
            summary: "{{fields.name}}"
            fields:
              - { label: "Customer name", name: "name", widget: "string", hint: "First name and last initial is fine" }
              - { label: "Review", name: "quote", widget: "text" }
              - { label: "Vehicle or job (optional)", name: "job", widget: "string", required: false }
