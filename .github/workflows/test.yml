name: Site checks

# Runs the zero-dependency checks in test.js on every push and pull request.
# A red X on GitHub means a content file or the page is broken; fix before the next admin save.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
